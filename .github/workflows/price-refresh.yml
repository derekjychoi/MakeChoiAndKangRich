name: Price Refresh

on:
  # GitHub Actions의 schedule 트리거는 이 저장소에서 몇 시간씩 밀리는 게 실측으로
  # 확인돼서 (72분 동안 15분 간격으로 5번 뜰 기회가 있었는데 0번 뜸) 아예 쓰지 않는다.
  # 대신 외부 크론 서비스(cron-job.org)가 GitHub API로 workflow_dispatch를 직접
  # 호출한다 - 이 방식은 즉시 실행 이벤트로 처리돼 실측상 지연이 없었다.
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Write Firebase service account key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > secrets/firebase-service-account.json

      - name: Refresh live prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/refresh_live_prices.py
