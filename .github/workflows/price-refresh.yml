name: Price Refresh

on:
  schedule:
    # GitHub Actions는 5분 간격 스케줄이 실제로는 몇 시간씩 밀리는 경우가 흔하다.
    # 15분 간격으로 절충하되, 정각/15분 등 "0으로 끝나는" 시각은 전세계 공개
    # 저장소가 몰려서 특히 더 밀리므로 7분 어긋나게 잡는다.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Write Firebase service account key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > secrets/firebase-service-account.json

      - name: Refresh live prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/refresh_live_prices.py
