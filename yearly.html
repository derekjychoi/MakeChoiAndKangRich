<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>연간 리포트</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F6F8" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0D10" />
<style>
  .year-row { display:flex; align-items:baseline; justify-content:space-between; margin: 14px 4px 10px; }
  #yearPicker { width:auto; height:auto; padding:0; border:none; background:transparent; font-size:1.1rem; font-weight:700; }
</style>
</head>
<body>
<div class="container">

  <div class="seg" style="margin-bottom:4px">
    <a href="index.html">월간</a>
    <a href="yearly.html" class="active" aria-current="page">연간</a>
  </div>

  <div id="signedOut" class="card">
    <p>구글 계정으로 로그인해주세요.</p>
    <button id="loginBtn">Google로 로그인</button>
  </div>

  <div id="contentArea" style="display:none;">
    <div class="year-row">
      <span><label for="yearPicker" class="sr-only">연도</label><select id="yearPicker"></select></span>
      <span class="month-sub" id="yearSub" style="margin:0"></span>
    </div>
    <div id="yearBody"></div>
  </div>
  <p id="status"></p>
</div>

<script>
  // 로그인 상태 깜빡임(페이지 이동마다 "로그인해주세요" 화면이 잠깐 보이는 것) 방지:
  // 이전에 로그인했던 적이 있으면 Firebase 초기화(비동기)를 기다리지 않고 바로
  // 콘텐츠를 보여준다. 실제로 로그아웃된 상태였다면 아래 onAuthStateChanged가
  // 금방 signedOut 화면으로 바로잡는다.
  if (localStorage.getItem("iaAuthed") === "1") {
    document.getElementById("signedOut").style.display = "none";
    document.getElementById("contentArea").style.display = "block";
  }
</script>
<script type="module">
  import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { auth, db, provider } from "./firebase-init.js";
  import "./pwa-register.js";
  import { formatKRW, formatMan, renderDivergingBars } from "./charts.js";
  import { classifyPriceSource } from "./asset-classify.js";

  const TAX_DEDUCTION_KRW = 2_500_000;
  const TAX_RATE = 0.22; // 양도소득세 20% + 지방소득세 2% (단순 추정)

  const $ = (id) => document.getElementById(id);
  const signedOutEl = $("signedOut");
  const contentAreaEl = $("contentArea");
  const statusEl = $("status");

  $("loginBtn").addEventListener("click", () => {
    signInWithPopup(auth, provider).catch((err) => { statusEl.textContent = "로그인 실패: " + err.message; });
  });

  let allReports = [];
  let allTransactions = [];

  function monthLabel(monthStr) {
    return `${parseInt(monthStr.split("-")[1], 10)}월`;
  }

  function estimateTax(year) {
    const sells = allTransactions.filter((t) => t.date.startsWith(year) && t.type === "매도");
    const buckets = { yahoo_us: 0, upbit_crypto: 0 };
    sells.forEach((t) => {
      const src = classifyPriceSource(t);
      if (src === "yahoo_us" || src === "upbit_crypto") {
        buckets[src] += t.realized_pnl || 0;
      }
    });

    const rows = [
      { label: "해외주식(개별/ETF)", realized: buckets.yahoo_us },
      { label: "코인", realized: buckets.upbit_crypto },
    ].map((r) => {
      const taxable = Math.max(0, r.realized - TAX_DEDUCTION_KRW);
      const tax = Math.round(taxable * TAX_RATE);
      return { ...r, taxable, tax };
    });

    const totalTax = rows.reduce((s, r) => s + r.tax, 0);
    return { rows, totalTax };
  }

  function renderYear(year) {
    const reports = allReports
      .filter((r) => r.month.startsWith(year))
      .sort((a, b) => (a.month < b.month ? -1 : 1));

    if (reports.length === 0) {
      $("yearBody").innerHTML = `<p class="empty-note">${year}년 데이터가 없습니다.</p>`;
      return;
    }

    const totalBuy = reports.reduce((s, r) => s + (r.total_buy_krw || 0), 0);
    const totalSell = reports.reduce((s, r) => s + (r.total_sell_krw || 0), 0);
    const totalRealized = reports.reduce((s, r) => s + (r.realized_pnl_krw || 0), 0);
    const totalTrades = reports.reduce((s, r) => s + (r.trade_count || 0), 0);
    const netBuy = totalBuy - totalSell;

    const netBuyItems = reports.map((r) => ({
      label: monthLabel(r.month), value: (r.total_buy_krw || 0) - (r.total_sell_krw || 0),
    }));
    const realizedItems = reports.map((r) => ({
      label: monthLabel(r.month), value: r.realized_pnl_krw || 0,
    }));
    // 월말 평가금액 세로 막대: 차이가 잘 보이도록 최솟값의 80%를 바닥으로 잡는다.
    const evals = reports.map((r) => r.total_eval_krw || 0);
    const maxEval = Math.max(1, ...evals);
    const floorEval = Math.min(...evals) * 0.8;
    const evalBars = reports.map((r, i) => `
      <div class="vbar ${i === reports.length - 1 ? "last" : ""}">
        <span class="v">${Math.round((r.total_eval_krw || 0) / 10000).toLocaleString()}</span>
        <div class="b" style="height:${Math.round(((r.total_eval_krw || 0) - floorEval) / (maxEval - floorEval || 1) * 110) + 10}px"></div>
        <span class="m">${monthLabel(r.month)}</span>
      </div>`).join("");
    $("yearSub").textContent = `${monthLabel(reports[0].month)} ~ ${monthLabel(reports[reports.length - 1].month)} 결산 기준`;

    const tableRows = reports.map((r) => `
      <tr>
        <td>${monthLabel(r.month)}</td>
        <td>${formatKRW((r.total_buy_krw || 0) - (r.total_sell_krw || 0))}</td>
        <td class="${r.realized_pnl_krw > 0 ? "text-good" : r.realized_pnl_krw < 0 ? "text-bad" : ""}">${formatKRW(r.realized_pnl_krw || 0)}</td>
        <td>${r.trade_count || 0}건</td>
        <td class="${r.overall_profit_pct > 0 ? "text-good" : r.overall_profit_pct < 0 ? "text-bad" : ""}">${formatKRW(r.total_eval_krw || 0)} (${r.overall_profit_pct > 0 ? "+" : ""}${Math.round(r.overall_profit_pct || 0)}%)</td>
      </tr>
    `).join("");

    $("yearBody").innerHTML = `
      <div class="stat-grid">
        <div class="stat-tile">
          <div class="stat-label">연간 실현손익</div>
          <div class="stat-value ${totalRealized > 0 ? "good" : totalRealized < 0 ? "bad" : ""}">${totalRealized > 0 ? "+" : ""}${formatMan(totalRealized)}</div>
          <div class="stat-sub">거래 ${totalTrades}건</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">연간 순매수</div>
          <div class="stat-value">${netBuy > 0 ? "+" : ""}${formatMan(netBuy)}</div>
          <div class="stat-sub">리포트 ${reports.length}개월</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">월말 평가금액 <span style="font-size:0.7rem">단위 만원</span></div>
        <div class="vbars">${evalBars}</div>
      </div>

      <div class="card">
        <div class="card-title">월별 실현손익</div>
        ${renderDivergingBars(realizedItems, "이익", "손실", formatKRW, false)}
      </div>

      <div class="card">
        <div class="card-title">월별 순매수</div>
        ${renderDivergingBars(netBuyItems, "순매수", "순매도", formatKRW, false)}
      </div>

      <div class="card">
        <h2>예상 양도소득세 (단순 추정)</h2>
        <p class="month-sub">해외주식/코인 매도 실현손익 기준, 각 자산군별 연 2,500,000원 공제 후 22%(양도소득세+지방소득세) 적용한 단순 계산입니다. 국내 개별주식/ETF는 과세 방식이 달라 제외했습니다. 실제 신고 시 세무사 상담을 권장합니다.</p>
        ${(() => {
          const { rows, totalTax } = estimateTax(year);
          return `
            <table class="data-table">
              <thead><tr><th>구분</th><th>실현손익</th><th>과세대상(공제후)</th><th>예상세금</th></tr></thead>
              <tbody>
                ${rows.map((r) => `
                  <tr>
                    <td>${r.label}</td>
                    <td class="${r.realized > 0 ? "text-good" : r.realized < 0 ? "text-bad" : ""}">${formatKRW(r.realized)}</td>
                    <td>${formatKRW(r.taxable)}</td>
                    <td>${formatKRW(r.tax)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
            <p class="stat-value" style="margin-top:10px;">합계 예상세금: ${formatKRW(totalTax)}</p>`;
        })()}
      </div>

      <div class="card">
        <h2>월별 상세</h2>
        <p class="month-sub">평가금액은 각 리포트가 생성된 시점(그 달 말) 종가 기준입니다. 지금 당장의 보유 현황은 <a href="holdings.html">실시간 보유현황</a>에서 확인하세요.</p>
        <table class="data-table">
          <thead><tr><th>월</th><th>순매수</th><th>실현손익</th><th>거래건수</th><th>월말 평가금액</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>`;
  }

  $("yearPicker").addEventListener("change", (e) => renderYear(e.target.value));

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      localStorage.removeItem("iaAuthed");
      signedOutEl.style.display = "block";
      contentAreaEl.style.display = "none";
      return;
    }
    localStorage.setItem("iaAuthed", "1");
    signedOutEl.style.display = "none";
    contentAreaEl.style.display = "block";

    statusEl.textContent = "불러오는 중...";
    try {
      const [reportsSnap, txSnap] = await Promise.all([
        getDocs(collection(db, "monthly_reports")),
        getDocs(collection(db, "transactions")),
      ]);
      allReports = reportsSnap.docs.map((d) => d.data());
      allTransactions = txSnap.docs.map((d) => d.data());
      statusEl.textContent = "";

      const years = [...new Set(allReports.map((r) => r.month.slice(0, 4)))].sort().reverse();
      if (years.length === 0) {
        $("yearBody").innerHTML = `<p class="empty-note">아직 데이터가 없습니다.</p>`;
        return;
      }
      $("yearPicker").innerHTML = years.map((y) => `<option value="${y}">${y}년</option>`).join("");
      renderYear(years[0]);
    } catch (err) {
      statusEl.textContent = "로드 실패: " + err.message;
    }
  });
</script>

  <div class="tabbar-inner">

    <a href="holdings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>보유</a>
    <a href="journal.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>일지</a>
    <a href="index.html" class="active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>리포트</a>
    <a href="more.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>더보기</a>
  </div>
</nav>
</body>
</html>
