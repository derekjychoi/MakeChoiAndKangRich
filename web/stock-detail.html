<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>종목 상세</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F6F8" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0D10" />
</head>
<body>
<div class="container">

  <div class="title-row">
    <a class="back-link" href="holdings.html" id="backLink" aria-label="뒤로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
    <span class="month-sub" style="margin:0" id="pageSub"></span>
  </div>
  <h1 id="pageTitle" style="margin-top:0">종목 상세</h1>
  <div class="hero" style="margin-top:0">
    <span class="hero-value" id="priceValue" style="font-size:2rem"></span>
    <span class="month-sub" id="priceSub" style="margin-left:6px"></span>
  </div>

  <div id="signedOut" class="card">
    <p>구글 계정으로 로그인해주세요.</p>
    <button id="loginBtn">Google로 로그인</button>
  </div>

  <div id="contentArea" style="display:none;">
    <div class="stat-grid" id="statArea"></div>

    <div class="card">
      <div class="card-title">월말 손익률 추이</div>
      <div id="trendArea"></div>
    </div>

    <div class="card-title" style="margin:16px 4px 8px">매매 이력</div>
    <div class="list" id="txRows"></div>
  </div>
  <p id="status" class="month-sub"></p>
</div>

<script>
  // 로그인 상태 깜빡임(페이지 이동마다 "로그인해주세요" 화면이 잠깐 보이는 것) 방지:
  // 이전에 로그인했던 적이 있으면 Firebase 초기화(비동기)를 기다리지 않고 바로
  // 콘텐츠를 보여준다. 실제로 로그아웃된 상태였다면 아래 onAuthStateChanged가
  // 금방 signedOut 화면으로 바로잡는다.
  if (localStorage.getItem("iaAuthed") === "1") {
    document.getElementById("signedOut").style.display = "none";
    document.getElementById("contentArea").style.display = "block";
  }
</script>
<script type="module">
  import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    collection, query, where, getDocs, doc, getDoc,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { auth, db, provider } from "./firebase-init.js";
  import { formatKRW, formatPct, escapeHtml, renderDivergingBars } from "./charts.js";
  import { classifyAssetClass } from "./asset-classify.js";
  import { computeHoldings, applyPrices } from "./holdings-calc.js";
  import "./pwa-register.js";

  const $ = (id) => document.getElementById(id);
  const signedOutEl = $("signedOut");
  const contentAreaEl = $("contentArea");
  const statusEl = $("status");

  const params = new URLSearchParams(location.search);
  const code = params.get("code") || "";

  $("loginBtn").addEventListener("click", () => {
    signInWithPopup(auth, provider).catch((err) => { statusEl.textContent = "로그인 실패: " + err.message; });
  });

  async function load() {
    if (!code) {
      statusEl.textContent = "종목코드가 없습니다 (예: stock-detail.html?code=005930)";
      return;
    }
    statusEl.textContent = "불러오는 중...";
    try {
      const q = query(collection(db, "transactions"), where("code", "==", code));
      const snap = await getDocs(q);
      const txs = snap.docs.map((d) => d.data()).sort((a, b) => (a.date < b.date ? 1 : -1));

      if (txs.length === 0) {
        statusEl.textContent = "해당 종목코드의 거래 내역이 없습니다.";
        return;
      }
      const name = txs[0].name;
      $("pageTitle").textContent = name;
      $("pageSub").textContent = `${classifyAssetClass(txs[0])} · ${code}`;
      document.title = `${name} - 종목 상세`;

      const priceDoc = await getDoc(doc(db, "latest_prices", code));
      const priceMap = priceDoc.exists() ? { [code]: priceDoc.data() } : {};
      const holdings = applyPrices(computeHoldings(txs), priceMap);
      const holding = holdings[0];

      if (holding) {
        $("priceValue").textContent = Math.round(holding.current_price_krw).toLocaleString();
        $("priceSub").textContent = holding.price_is_live ? "원 · 현재가" : "원 · 실시간 미지원(평단가 대체)";
        const pnlCls = holding.profit_krw > 0 ? "good" : holding.profit_krw < 0 ? "bad" : "";
        $("statArea").innerHTML = `
          <div class="stat-tile"><div class="stat-label">보유</div><div class="stat-value">${holding.quantity.toLocaleString()}</div></div>
          <div class="stat-tile"><div class="stat-label">평균단가</div><div class="stat-value">${Math.round(holding.avg_buy_price_krw).toLocaleString()}</div></div>
          <div class="stat-tile"><div class="stat-label">평가금액</div><div class="stat-value">${Math.round(holding.eval_total_krw).toLocaleString()}</div></div>
          <div class="stat-tile"><div class="stat-label">평가손익</div><div class="stat-value ${pnlCls}">${formatPct(holding.profit_pct)}</div><div class="stat-sub">${formatKRW(holding.profit_krw)}</div></div>`;
      } else {
        $("statArea").innerHTML = `<p class="empty-note">현재 보유하고 있지 않은 종목입니다 (전량 매도됨).</p>`;
      }

      $("txRows").innerHTML = txs.map((t) => `
        <div class="list-row">
          <span class="badge ${t.type === "매수" ? "up" : "down"}">${escapeHtml(t.type)}</span>
          <div class="list-main">
            <div class="list-name num">${Math.abs(t.quantity).toLocaleString()} × ${Math.round(t.unit_price).toLocaleString()}</div>
            <div class="list-sub">${escapeHtml([t.date, t.broker].filter(Boolean).join(" · "))}</div>
          </div>
          <div class="list-end">
            <div class="list-value">${Math.abs(Math.round(t.amount)).toLocaleString()}</div>
            ${t.realized_pnl ? `<div class="list-delta ${t.realized_pnl > 0 ? "text-good" : "text-bad"}">실현 ${formatKRW(t.realized_pnl)}</div>` : ""}
          </div>
        </div>
      `).join("");

      const reportsSnap = await getDocs(collection(db, "monthly_reports"));
      const reports = reportsSnap.docs.map((d) => d.data()).sort((a, b) => (a.month < b.month ? -1 : 1));
      const trendItems = [];
      reports.forEach((r) => {
        const h = (r.holdings_snapshot || []).find((x) => x.name === name);
        if (h) trendItems.push({ label: `${r.month.slice(2, 4)}.${parseInt(r.month.split("-")[1], 10)}`, value: h.profit_pct });
      });
      $("trendArea").innerHTML = trendItems.length
        ? renderDivergingBars(trendItems, "이익", "손실", (v) => formatPct(v, false), false)
        : `<p class="empty-note">월간 리포트에 이 종목 기록이 아직 없습니다.</p>`;

      statusEl.textContent = "";
    } catch (err) {
      statusEl.textContent = "로드 실패: " + err.message;
    }
  }

  // 뒤로: 앱 안에서 들어왔으면 그 페이지로 (보유현황/홈/일지 어디서든 열 수 있어서)
  $("backLink").addEventListener("click", (e) => {
    if (document.referrer && new URL(document.referrer).origin === location.origin) {
      e.preventDefault();
      history.back();
    }
  });

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      localStorage.removeItem("iaAuthed");
      signedOutEl.style.display = "block";
      contentAreaEl.style.display = "none";
      return;
    }
    localStorage.setItem("iaAuthed", "1");
    signedOutEl.style.display = "none";
    contentAreaEl.style.display = "block";
    load();
  });
</script>
<nav class="tabbar" aria-label="주요 메뉴">
  <div class="tabbar-inner">
    <a href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>홈</a>
    <a href="holdings.html" class="active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>보유</a>
    <a href="journal.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>일지</a>
    <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>리포트</a>
    <a href="more.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>더보기</a>
  </div>
</nav>
</body>
</html>
