<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>거래 일지</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#2a78d6" />
<style>
  .toolbar { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar input { flex:1; min-width:160px; }
  .row-actions button { padding:4px 8px; font-size:0.75rem; margin-left:4px; }
  #editPanel { display:none; }
  /* 좁은 화면에서 셀 글자가 한 글자씩 세로로 꺾여 보이는 걸 막는다 - 테이블이
     내용물 폭만큼 넓어지게 하고, 넘치는 만큼은 래퍼 div가 가로 스크롤로 보여준다. */
  #journalTable { width: max-content; min-width: 100%; }
  #journalTable th, #journalTable td { white-space: nowrap; }
</style>
</head>
<body>
<div class="container">
  <nav class="app-nav">
    <a href="home.html">홈</a>
    <a href="index.html">월간 리포트</a>
    <a href="yearly.html">연간 리포트</a>
    <a href="holdings.html">실시간 보유현황</a>
    <a href="journal.html" class="active">거래 일지</a>
    <a href="add-transaction.html">+ 거래 입력</a>
    <a href="alerts.html">알림 로그</a>
    <a href="goal.html">목표</a>
  </nav>

  <h1>📒 전체 매수/매도 일지</h1>

  <div id="signedOut" class="card">
    <p>구글 계정으로 로그인해주세요.</p>
    <button id="loginBtn">Google로 로그인</button>
  </div>

  <div id="contentArea" style="display:none;">
    <div id="editPanel" class="card">
      <h2>거래 수정</h2>
      <div class="form-grid">
        <div class="field"><label>날짜</label><input type="date" id="e-date" /></div>
        <div class="field"><label>매수/매도</label>
          <select id="e-type"><option value="매수">매수</option><option value="매도">매도</option></select>
        </div>
        <div class="field"><label>종목명</label><input type="text" id="e-name" /></div>
        <div class="field"><label>종목코드</label><input type="text" id="e-code" /></div>
        <div class="field"><label>시장</label>
          <select id="e-market"><option value="국내">국내</option><option value="해외">해외</option></select>
        </div>
        <div class="field e-usd-field" style="display:none;"><label>단가 (USD)</label><input type="number" id="e-price-usd" step="any" min="0" /></div>
        <div class="field e-usd-field" style="display:none;"><label>환율 (원/USD, 수정 가능)</label><input type="number" id="e-fx" step="any" min="0" /></div>
        <div class="field"><label id="e-price-label">단가 (원)</label><input type="number" id="e-price" step="any" /></div>
        <div class="field"><label>수량</label><input type="number" id="e-qty" step="any" /></div>
        <div class="field"><label>금액 (원)</label><input type="number" id="e-amount" step="any" /></div>
        <div class="field"><label>실현손익 (원)</label><input type="number" id="e-realized" step="any" /></div>
      </div>
      <p id="e-fxInfo" class="month-sub" style="display:none;"></p>
      <button id="saveEditBtn" style="margin-top:12px;">저장</button>
      <button id="cancelEditBtn" class="secondary" style="margin-top:12px;">취소</button>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="text" id="searchBox" placeholder="종목명으로 검색..." />
        <select id="typeFilter">
          <option value="">전체</option>
          <option value="매수">매수만</option>
          <option value="매도">매도만</option>
        </select>
      </div>
      <p id="summaryLine" class="month-sub"></p>
      <div style="overflow-x:auto;">
        <table class="data-table" id="journalTable">
          <thead>
            <tr>
              <th>날짜</th><th>구분</th><th>종목</th><th>증권사</th>
              <th>단가</th><th>수량</th><th>금액</th><th>실현손익</th><th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="status" style="margin-top:10px;"></p>
    </div>
  </div>
</div>

<script>
  // 로그인 상태 깜빡임(페이지 이동마다 "로그인해주세요" 화면이 잠깐 보이는 것) 방지:
  // 이전에 로그인했던 적이 있으면 Firebase 초기화(비동기)를 기다리지 않고 바로
  // 콘텐츠를 보여준다. 실제로 로그아웃된 상태였다면 아래 onAuthStateChanged가
  // 금방 signedOut 화면으로 바로잡는다.
  if (localStorage.getItem("iaAuthed") === "1") {
    document.getElementById("signedOut").style.display = "none";
    document.getElementById("contentArea").style.display = "block";
  }
</script>
<script type="module">
  import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    collection, getDocs, doc, updateDoc, deleteDoc, deleteField,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { auth, db, provider } from "./firebase-init.js";
  import "./pwa-register.js";
  import { syncKnownInstruments } from "./known-instruments.js";
  import { formatKRW, escapeHtml } from "./charts.js";

  const $ = (id) => document.getElementById(id);
  const signedOutEl = $("signedOut");
  const contentAreaEl = $("contentArea");
  const statusEl = $("status");

  $("loginBtn").addEventListener("click", () => {
    signInWithPopup(auth, provider).catch((err) => { statusEl.textContent = "로그인 실패: " + err.message; });
  });

  let allTx = []; // [{id, ...data}]

  function render() {
    const q = $("searchBox").value.trim().toLowerCase();
    const typeF = $("typeFilter").value;
    let list = allTx.filter((t) =>
      (!q || t.name.toLowerCase().includes(q)) && (!typeF || t.type === typeF)
    );
    list.sort((a, b) => (a.date < b.date ? 1 : -1));

    $("summaryLine").textContent = `총 ${list.length}건`;

    $("rows").innerHTML = list.map((t) => `
      <tr>
        <td>${t.date}</td>
        <td>${t.type}</td>
        <td><a href="stock-detail.html?code=${encodeURIComponent(t.code)}">${escapeHtml(t.name)}</a></td>
        <td>${escapeHtml(t.broker || "")}</td>
        <td>${Math.round(t.unit_price).toLocaleString()}원${t.unit_price_usd ? ` <span class="month-sub">($${t.unit_price_usd.toLocaleString("en-US", { maximumFractionDigits: 4 })})</span>` : ""}</td>
        <td>${t.quantity}</td>
        <td>${formatKRW(t.amount)}</td>
        <td class="${t.realized_pnl > 0 ? "text-good" : t.realized_pnl < 0 ? "text-bad" : ""}">${t.realized_pnl ? formatKRW(t.realized_pnl) : "-"}</td>
        <td class="row-actions">
          <button data-id="${t.id}" class="editBtn secondary">수정</button>
          <button data-id="${t.id}" class="deleteBtn danger">삭제</button>
        </td>
      </tr>
    `).join("");

    document.querySelectorAll(".editBtn").forEach((btn) => {
      btn.addEventListener("click", () => openEdit(btn.dataset.id));
    });
    document.querySelectorAll(".deleteBtn").forEach((btn) => {
      btn.addEventListener("click", () => removeTx(btn.dataset.id));
    });
  }

  $("searchBox").addEventListener("input", render);
  $("typeFilter").addEventListener("change", render);

  // 해외(USD) 거래는 달러 단가 x 환율로 원화 단가/금액을 다시 계산한다. 저장되는
  // unit_price/amount는 항상 원화(add-transaction.html과 동일 컨벤션). 과거 거래를
  // 고치는 화면이라 오늘 환율이 아니라 거래일 환율을 조회한다 - frankfurter(ECB 고시
  // 환율, CORS 허용, 주말/휴일은 직전 영업일 값). 기존에 기록된 fx_rate_used가 있으면 그걸 우선 쓴다.
  let fxReqSeq = 0;

  async function fetchFxForDate(date) {
    if (!date) return;
    const seq = ++fxReqSeq;
    $("e-fxInfo").style.display = "block";
    $("e-fxInfo").textContent = `${date} 환율 조회 중...`;
    try {
      const res = await fetch(`https://api.frankfurter.dev/v1/${date}?from=USD&to=KRW`);
      const data = await res.json();
      const rate = data?.rates?.KRW;
      if (!rate) throw new Error("환율 응답에 KRW 없음");
      if (seq !== fxReqSeq) return; // 그 사이 날짜/거래가 바뀌었으면 무시
      $("e-fx").value = rate;
      syncPriceLock();
      $("e-fxInfo").textContent = `환율: 1 USD = ${rate.toLocaleString("ko-KR", { maximumFractionDigits: 2 })}원 (${data.date} 고시 기준, 자동조회 - 실제 체결 환율과 다르면 직접 수정)`;
      recalcFromUsd();
    } catch (err) {
      if (seq !== fxReqSeq) return;
      $("e-fxInfo").textContent = "환율 조회 실패 - 환율을 직접 입력해주세요.";
    }
  }

  function recalcFromUsd() {
    if ($("e-market").value !== "해외") return;
    const usd = Math.abs(parseFloat($("e-price-usd").value) || 0);
    const fx = Math.abs(parseFloat($("e-fx").value) || 0);
    if (!usd || !fx) return;
    const price = Math.round(usd * fx * 100) / 100;
    $("e-price").value = price;
    const qty = Math.abs(parseFloat($("e-qty").value) || 0);
    if (qty) {
      // 매도 거래는 amount를 음수로 저장하는 컨벤션 유지
      const sign = $("e-type").value === "매도" ? -1 : 1;
      $("e-amount").value = sign * Math.round(price * qty);
    }
  }

  // 달러 단가와 환율이 모두 있을 때만 원화 단가를 잠근다 (없으면 원화 직접 입력)
  function syncPriceLock() {
    const locked = $("e-market").value === "해외"
      && !!parseFloat($("e-price-usd").value) && !!parseFloat($("e-fx").value);
    $("e-price").readOnly = locked;
    $("e-price-label").textContent = locked ? "단가 (원, USD x 환율 자동계산)" : "단가 (원)";
  }

  function syncEditMarketFields() {
    const isOverseas = $("e-market").value === "해외";
    document.querySelectorAll(".e-usd-field").forEach((el) => { el.style.display = isOverseas ? "block" : "none"; });
    syncPriceLock();
    if (!isOverseas) {
      fxReqSeq++;
      $("e-fxInfo").style.display = "none";
      return;
    }
    if (!parseFloat($("e-fx").value)) fetchFxForDate($("e-date").value);
  }

  $("e-market").addEventListener("change", syncEditMarketFields);
  $("e-date").addEventListener("change", () => {
    if ($("e-market").value === "해외") fetchFxForDate($("e-date").value);
  });
  // 환율을 직접 고치기 시작하면 진행 중인 자동조회 결과가 덮어쓰지 않게 한다
  $("e-fx").addEventListener("input", () => { fxReqSeq++; });
  ["e-price-usd", "e-fx", "e-qty"].forEach((id) => {
    $(id).addEventListener("input", () => { recalcFromUsd(); syncPriceLock(); });
  });
  $("e-type").addEventListener("change", recalcFromUsd);

  function openEdit(id) {
    const t = allTx.find((x) => x.id === id);
    if (!t) return;
    $("editPanel").dataset.editId = id;
    $("e-date").value = t.date;
    $("e-type").value = t.type;
    $("e-name").value = t.name;
    $("e-code").value = t.code;
    $("e-price").value = t.unit_price;
    $("e-qty").value = t.quantity;
    $("e-amount").value = t.amount;
    $("e-realized").value = t.realized_pnl || 0;
    $("e-market").value = t.market === "해외" ? "해외" : "국내";
    $("e-price-usd").value = t.unit_price_usd || "";
    $("e-fx").value = t.fx_rate_used || "";
    fxReqSeq++;
    $("e-fxInfo").style.display = "none";
    if (t.market === "해외" && t.fx_rate_used) {
      $("e-fxInfo").style.display = "block";
      $("e-fxInfo").textContent = "환율: 입력 당시 기록된 값 (날짜를 바꾸면 해당일 환율로 다시 조회)";
    }
    syncEditMarketFields();
    $("editPanel").style.display = "block";
    $("editPanel").scrollIntoView({ behavior: "smooth" });
  }

  $("cancelEditBtn").addEventListener("click", () => { $("editPanel").style.display = "none"; });

  $("saveEditBtn").addEventListener("click", async () => {
    const id = $("editPanel").dataset.editId;
    statusEl.textContent = "저장 중...";
    const isOverseas = $("e-market").value === "해외";
    const usd = Math.abs(parseFloat($("e-price-usd").value) || 0);
    const fx = Math.abs(parseFloat($("e-fx").value) || 0);
    try {
      await updateDoc(doc(db, "transactions", id), {
        market: $("e-market").value,
        // 참고용 기록(계산엔 안 쓰임). 국내로 바꾸거나 달러 단가를 비우면 지운다.
        unit_price_usd: isOverseas && usd && fx ? usd : deleteField(),
        fx_rate_used: isOverseas && usd && fx ? fx : deleteField(),
        date: $("e-date").value,
        type: $("e-type").value,
        name: $("e-name").value.trim(),
        code: $("e-code").value.trim(),
        unit_price: parseFloat($("e-price").value) || 0,
        quantity: parseFloat($("e-qty").value) || 0,
        amount: parseFloat($("e-amount").value) || 0,
        realized_pnl: parseFloat($("e-realized").value) || 0,
      });
      $("editPanel").style.display = "none";
      statusEl.textContent = "수정 완료";
      await loadAll();
    } catch (err) {
      statusEl.textContent = "수정 실패: " + err.message;
    }
  });

  async function removeTx(id) {
    if (!confirm("이 거래를 삭제할까요? 되돌릴 수 없습니다.")) return;
    statusEl.textContent = "삭제 중...";
    try {
      await deleteDoc(doc(db, "transactions", id));
      statusEl.textContent = "삭제 완료";
      await loadAll();
    } catch (err) {
      statusEl.textContent = "삭제 실패: " + err.message;
    }
  }

  async function loadAll() {
    statusEl.textContent = "불러오는 중...";
    const snap = await getDocs(collection(db, "transactions"));
    allTx = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    syncKnownInstruments(db, allTx);
    statusEl.textContent = "";
    render();
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      localStorage.removeItem("iaAuthed");
      signedOutEl.style.display = "block";
      contentAreaEl.style.display = "none";
      return;
    }
    localStorage.setItem("iaAuthed", "1");
    signedOutEl.style.display = "none";
    contentAreaEl.style.display = "block";
    await loadAll();
  });
</script>
</body>
</html>
