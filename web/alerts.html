<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>알림 로그</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F6F8" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0D10" />
</head>
<body>
<div class="container">

  <div class="title-row">
    <a class="back-link" href="more.html" aria-label="더보기로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
    <h1 style="margin:0; font-size:1.15rem">급등락 알림</h1>
  </div>

  <div id="signedOut" class="card">
    <p>구글 계정으로 로그인해주세요.</p>
    <button id="loginBtn">Google로 로그인</button>
  </div>

  <div id="contentArea" style="display:none;">
    <div class="notice" style="margin-top:8px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
      직전 시세 대비 ±5% 이상 · 보유 중인 종목만 · 5분 간격 조회
    </div>
    <div class="chips" id="dirFilter" role="group" aria-label="급등/급락 필터">
      <button class="chip active" data-filter="">전체</button>
      <button class="chip" data-filter="급등">급등</button>
      <button class="chip" data-filter="급락">급락</button>
    </div>
    <div id="rows"></div>
  </div>
  <p id="status" class="month-sub"></p>
</div>

<script>
  // 로그인 상태 깜빡임(페이지 이동마다 "로그인해주세요" 화면이 잠깐 보이는 것) 방지:
  // 이전에 로그인했던 적이 있으면 Firebase 초기화(비동기)를 기다리지 않고 바로
  // 콘텐츠를 보여준다. 실제로 로그아웃된 상태였다면 아래 onAuthStateChanged가
  // 금방 signedOut 화면으로 바로잡는다.
  if (localStorage.getItem("iaAuthed") === "1") {
    document.getElementById("signedOut").style.display = "none";
    document.getElementById("contentArea").style.display = "block";
  }
</script>
<script type="module">
  import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { auth, db, provider } from "./firebase-init.js";
  import { formatKRW, escapeHtml } from "./charts.js";
  import "./pwa-register.js";

  const $ = (id) => document.getElementById(id);
  const signedOutEl = $("signedOut");
  const contentAreaEl = $("contentArea");
  const statusEl = $("status");

  $("loginBtn").addEventListener("click", () => {
    signInWithPopup(auth, provider).catch((err) => { statusEl.textContent = "로그인 실패: " + err.message; });
  });

  let allAlerts = [];
  let dirFilter = "";
  const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

  // 날짜별로 묶은 카드 목록 (급등/급락 아이콘 + 변동률, 아래 줄에 이전가 → 이후가)
  function render() {
    const groups = [];
    allAlerts.filter((a) => !dirFilter || a.direction === dirFilter).forEach((a) => {
      const ts = a.created_at?.toDate ? a.created_at.toDate() : null;
      const key = ts ? `${ts.getFullYear()}년 ${ts.getMonth() + 1}월 ${ts.getDate()}일 (${WEEKDAYS[ts.getDay()]})` : "날짜 없음";
      const last = groups[groups.length - 1];
      if (last && last.key === key) last.items.push({ a, ts });
      else groups.push({ key, items: [{ a, ts }] });
    });
    $("rows").innerHTML = groups.map((g) => `
      <div class="group-label">${g.key}</div>
      <div class="list">
        ${g.items.map(({ a, ts }) => {
          const isUp = a.direction === "급등";
          const icon = isUp ? "M3 17l6-6 4 4 8-8M14 7h7v7" : "M3 7l6 6 4-4 8 8M14 17h7v-7";
          const time = ts ? ts.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false }) : "";
          return `
          <div class="list-row">
            <span class="icon-circle ${isUp ? "up" : "down"}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${icon}"/></svg></span>
            <div class="list-main">
              <div class="list-name">${escapeHtml(a.name)}</div>
              <div class="list-sub">${escapeHtml(a.direction)} · ${time} · ${formatKRW(a.old_price_krw)} → ${formatKRW(a.new_price_krw)}</div>
            </div>
            <span class="num ${isUp ? "text-good" : "text-bad"}" style="font-weight:700">${a.change_pct > 0 ? "+" : ""}${a.change_pct.toFixed(1)}%</span>
          </div>`;
        }).join("")}
      </div>`).join("") || `<p class="empty-note" style="margin-top:12px">해당하는 알림이 없습니다.</p>`;
  }

  document.querySelectorAll("#dirFilter .chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      dirFilter = chip.dataset.filter;
      document.querySelectorAll("#dirFilter .chip").forEach((c) => c.classList.toggle("active", c === chip));
      render();
    });
  });

  async function loadAlerts() {
    statusEl.textContent = "불러오는 중...";
    try {
      const q = query(collection(db, "price_alerts"), orderBy("created_at", "desc"), limit(200));
      const snap = await getDocs(q);
      if (snap.empty) {
        statusEl.textContent = "아직 기록된 알림이 없습니다.";
        $("rows").innerHTML = "";
        return;
      }
      statusEl.textContent = "";
      allAlerts = snap.docs.map((doc) => doc.data());
      render();
    } catch (err) {
      statusEl.textContent = "로드 실패: " + err.message;
    }
  }

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      localStorage.removeItem("iaAuthed");
      signedOutEl.style.display = "block";
      contentAreaEl.style.display = "none";
      return;
    }
    localStorage.setItem("iaAuthed", "1");
    signedOutEl.style.display = "none";
    contentAreaEl.style.display = "block";
    loadAlerts();
  });
</script>

    <a href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>홈</a>
    <a href="holdings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>보유</a>
    <a href="journal.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>일지</a>
    <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>리포트</a>
    <a href="more.html" class="active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>더보기</a>
  </div>
</nav>
</body>
</html>
