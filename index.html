<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>월간 리포트</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F6F8" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0D10" />
<style>
  .month-nav { display:flex; align-items:center; justify-content:space-between; margin: 12px 0; }
  .month-nav button {
    width:44px; height:44px; padding:0; border-radius:22px; background:transparent; color: var(--text);
    display:flex; align-items:center; justify-content:center;
  }
  .month-nav button:disabled { color: var(--muted); opacity: 0.4; }
  .month-title { text-align:center; min-width:0; }
  /* 월 이름 자체가 월 선택 드롭다운 - 눌러서 원하는 달로 바로 이동 */
  #monthPicker {
    width:auto; height:auto; padding:0 4px; border:none; background:transparent;
    font-size:1.1rem; font-weight:700; text-align:center; text-align-last:center;
  }
  .month-title .sub { font-size:0.7rem; color: var(--muted); }
  .advice-summary {
    background: var(--inset); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
    font-family: var(--num-font); font-size: 0.78rem; line-height: 1.7; white-space: pre-wrap;
  }
  .advice-box.clamped { max-height: 11.5em; overflow: hidden; position: relative; }
  .advice-box.clamped::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3em;
    background: linear-gradient(transparent, var(--inset));
  }
  .advice-foot { display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:0.75rem; color: var(--muted); }
  .advice-foot button { background:none; color: var(--accent); padding:0; font-size:0.8rem; }
</style>
</head>
<body>
<div class="container">
  <div class="seg" style="margin-bottom:4px">
    <a href="index.html" class="active" aria-current="page">월간</a>
    <a href="yearly.html">연간</a>
  </div>

  <div id="signedOut" class="card" style="margin-top:12px">
    <p>구글 계정으로 로그인해주세요.</p>
    <button id="loginBtn">Google로 로그인</button>
  </div>

  <div id="contentArea" style="display:none;">
    <div class="month-nav">
      <button id="prevMonthBtn" aria-label="이전 달"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
      <div class="month-title">
        <label for="monthPicker" class="sr-only">월 선택</label>
        <select id="monthPicker"></select>
        <div class="sub" id="monthSub"></div>
      </div>
      <button id="nextMonthBtn" aria-label="다음 달"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>

    <div id="reports"></div>
  </div>
  <p id="status"></p>
</div>

<script>
  // 로그인 상태 깜빡임(페이지 이동마다 "로그인해주세요" 화면이 잠깐 보이는 것) 방지:
  // 이전에 로그인했던 적이 있으면 Firebase 초기화(비동기)를 기다리지 않고 바로
  // 콘텐츠를 보여준다. 실제로 로그아웃된 상태였다면 아래 onAuthStateChanged가
  // 금방 signedOut 화면으로 바로잡는다.
  if (localStorage.getItem("iaAuthed") === "1") {
    document.getElementById("signedOut").style.display = "none";
    document.getElementById("contentArea").style.display = "block";
  }
</script>
<script type="module">
  import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { auth, db, provider } from "./firebase-init.js";
  import "./pwa-register.js";
  import { formatKRW, formatPct, formatMonth, formatMan, escapeHtml, renderDivergingBars, renderAllocationStack } from "./charts.js";

  const $ = (id) => document.getElementById(id);
  const signedOutEl = $("signedOut");
  const contentAreaEl = $("contentArea");
  const statusEl = $("status");
  const reportsEl = $("reports");

  let allReports = []; // 최신 -> 과거 순 정렬
  let currentIndex = 0;

  $("loginBtn").addEventListener("click", () => {
    signInWithPopup(auth, provider).catch((err) => { statusEl.textContent = "로그인 실패: " + err.message; });
  });

  function renderRebalanceList(actions) {
    if (!actions || actions.length === 0) return "";
    return `
      <div class="card-title" style="margin-top:14px">리밸런싱 제안</div>
      ${actions.map((a) => {
        const qtyPart = a.quantity ? `${a.quantity}주` : "";
        const amountPart = a.amount_krw ? formatKRW(a.amount_krw) : "";
        const qtyAmount = [qtyPart, amountPart ? `(약 ${amountPart})` : ""].filter(Boolean).join(" ") || "-";
        return `
          <div class="list-row" style="align-items:flex-start">
            <span class="badge ${a.action === "매도" ? "down" : "up"}">${escapeHtml(a.action || "")}</span>
            <div class="list-main">
              <div class="list-name" style="white-space:normal">${escapeHtml(a.name || "")} <span class="num" style="font-weight:600">${escapeHtml(qtyAmount)}</span></div>
              <div class="list-sub" style="font-size:0.75rem">${escapeHtml(a.reason || "")}</div>
            </div>
          </div>`;
      }).join("")}`;
  }

  // 의견 본문 첫 두 줄이 📊/📈 고정 요약(generate_sector_advice.py)이면 따로 떼어 위에 보여준다.
  function splitAdvice(text) {
    const lines = text.split("\n");
    const summary = [];
    while (lines.length && /^[📊📈]/u.test(lines[0].trim())) summary.push(lines.shift().trim());
    return { summary: summary.join("\n"), body: lines.join("\n").trim() };
  }

  function renderAdvice(report) {
    if (!report.sector_allocation_advice) return "";
    const { summary, body } = splitAdvice(report.sector_allocation_advice);
    const isRebalanceMonth = Object.keys(report.target_allocation || {}).length > 0;
    return `
      <div class="card">
        <div class="card-title" style="color:var(--text); font-weight:700; font-size:0.9rem">
          <span style="display:flex; align-items:center; gap:8px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
            AI 자산배분 의견
          </span>
          <span style="font-size:0.7rem; color:var(--muted); font-weight:400">참고용</span>
        </div>
        ${summary ? `<div class="advice-summary">${escapeHtml(summary)}</div>` : ""}
        <div class="advice-box clamped" id="adviceBody">${escapeHtml(body)}</div>
        <div class="advice-foot">
          <span>${isRebalanceMonth ? "반기 결산 리밸런싱 포함" : "리밸런싱 제안은 6·12월 결산에만"}</span>
          <button type="button" id="adviceToggle">전문 보기</button>
        </div>
        ${renderRebalanceList(report.rebalancing_actions)}
      </div>`;
  }

  function renderReport(report) {
    const netBuy = report.total_buy_krw - report.total_sell_krw;
    const sectorItems = Object.entries(report.net_flow_by_sector_krw || {})
      .map(([label, value]) => ({ label, value }));
    const holdingItems = (report.holdings_snapshot || [])
      .map((h) => ({ label: h.name, value: h.profit_pct }));
    const pctCls = (v) => (v > 0 ? "good" : v < 0 ? "bad" : "");

    return `
      <div class="stat-grid">
        <div class="stat-tile"><div class="stat-label">월말 평가금액</div><div class="stat-value">${formatMan(report.total_eval_krw)}</div></div>
        <div class="stat-tile"><div class="stat-label">누적 수익률</div><div class="stat-value ${pctCls(report.overall_profit_pct)}">${formatPct(report.overall_profit_pct)}</div></div>
        <div class="stat-tile"><div class="stat-label">순매수</div><div class="stat-value">${netBuy > 0 ? "+" : ""}${formatMan(netBuy)}</div></div>
        <div class="stat-tile"><div class="stat-label">실현손익</div><div class="stat-value ${pctCls(report.realized_pnl_krw)}">${report.realized_pnl_krw > 0 ? "+" : ""}${formatMan(report.realized_pnl_krw)}</div></div>
      </div>

      <div class="card">
        <div class="card-title">자산 배분 · ${formatMonth(report.month)} 말</div>
        ${renderAllocationStack(report.asset_class_breakdown || {})}
      </div>

      ${renderAdvice(report)}

      <div class="card">
        <div class="card-title">보유 종목 평가손익률</div>
        ${renderDivergingBars(holdingItems, "이익", "손실", (v) => formatPct(v, false))}
        ${holdingItems.length ? `
          <details class="table-toggle">
            <summary>표로 보기</summary>
            <table class="data-table">
              <thead><tr><th>종목</th><th>평가금액</th><th>평가손익</th><th>수익률</th></tr></thead>
              <tbody>
                ${(report.holdings_snapshot || []).slice()
                  .sort((a, b) => b.profit_pct - a.profit_pct)
                  .map((h) => `
                    <tr>
                      <td>${escapeHtml(h.name)}</td>
                      <td>${formatKRW(h.eval_total_krw)}</td>
                      <td>${formatKRW(h.profit_krw)}</td>
                      <td>${formatPct(h.profit_pct)}</td>
                    </tr>
                  `).join("")}
              </tbody>
            </table>
          </details>` : ""}
      </div>

      <div class="card">
        <div class="card-title">섹터별 순매수 / 순매도</div>
        ${renderDivergingBars(sectorItems, "순매수", "순매도", formatKRW)}
      </div>`;
  }

  function showReport(index) {
    currentIndex = Math.max(0, Math.min(allReports.length - 1, index));
    const report = allReports[currentIndex];
    $("monthPicker").value = report.month;
    const generated = report.advice_generated_at || report.generated_at;
    $("monthSub").textContent = `${generated ? new Date(generated).toLocaleDateString("ko-KR") + " 생성 · " : ""}거래 ${report.trade_count}건`;
    // allReports는 최신 -> 과거 순이라 "이전 달"은 index + 1
    $("prevMonthBtn").disabled = currentIndex >= allReports.length - 1;
    $("nextMonthBtn").disabled = currentIndex === 0;
    reportsEl.innerHTML = renderReport(report);

    const toggle = $("adviceToggle");
    if (toggle) {
      toggle.addEventListener("click", () => {
        const expanded = $("adviceBody").classList.toggle("clamped") === false;
        toggle.textContent = expanded ? "접기" : "전문 보기";
      });
    }
  }

  $("prevMonthBtn").addEventListener("click", () => showReport(currentIndex + 1));
  $("nextMonthBtn").addEventListener("click", () => showReport(currentIndex - 1));
  $("monthPicker").addEventListener("change", (e) => {
    showReport(allReports.findIndex((r) => r.month === e.target.value));
  });

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      localStorage.removeItem("iaAuthed");
      signedOutEl.style.display = "block";
      contentAreaEl.style.display = "none";
      return;
    }
    localStorage.setItem("iaAuthed", "1");
    signedOutEl.style.display = "none";
    contentAreaEl.style.display = "block";

    statusEl.textContent = "리포트 불러오는 중...";
    try {
      const snap = await getDocs(collection(db, "monthly_reports"));
      if (snap.empty) {
        statusEl.textContent = "아직 저장된 월간 리포트가 없습니다. (정상 - 아직 생성 전)";
        contentAreaEl.style.display = "none";
        return;
      }
      statusEl.textContent = "";
      allReports = snap.docs.map((d) => d.data()).sort((a, b) => (a.month < b.month ? 1 : -1));
      $("monthPicker").innerHTML = allReports
        .map((r) => `<option value="${r.month}">${formatMonth(r.month)}</option>`).join("");
      showReport(0);
    } catch (err) {
      statusEl.textContent = "리포트 로드 실패 (권한 문제일 수 있음): " + err.message;
    }
  });
</script>
<nav class="tabbar" aria-label="주요 메뉴">
  <div class="tabbar-inner">
    <a href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>홈</a>
    <a href="holdings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>보유</a>
    <a href="journal.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>일지</a>
    <a href="index.html" class="active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>리포트</a>
    <a href="more.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>더보기</a>
  </div>
</nav>
</body>
</html>
