<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>실시간 보유현황</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F6F8" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0D10" />
<style>
  .stale-badge {
    font-size: 0.68rem; color: var(--text-muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 1px 5px; margin-left: 6px;
  }
</style>
</head>
<body>
<div class="container">

  <div class="page-header">
    <div>
      <h1>보유현황</h1>
      <div class="sub"><span class="live-dot"></span><span id="lastUpdated">시세 불러오는 중...</span></div>
    </div>
    <a class="pill-btn" href="add-transaction.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>거래</a>
  </div>

  <div id="signedOut" class="card">
    <p>구글 계정으로 로그인해주세요.</p>
    <button id="loginBtn">Google로 로그인</button>
  </div>

  <div id="contentArea" style="display:none;">
    <div class="hero">
      <div class="hero-value" id="statEval" style="font-size:1.9rem">-</div>
      <div class="hero-sub"><span id="statProfit"></span><span id="statInvested"></span></div>
    </div>

    <div class="card">
      <div class="card-title"><span id="targetChartTitle">목표 비중 대비</span><span id="targetChartSub" style="font-size:0.7rem"></span></div>
      <div id="targetArea"></div>
    </div>

    <div class="card-title" style="margin:16px 4px 8px"><span>보유 종목 <span id="statCount"></span></span></div>
    <div class="list" id="holdingsRows"></div>
    <p id="status" class="month-sub"></p>
  </div>
</div>

<script>
  // 로그인 상태 깜빡임(페이지 이동마다 "로그인해주세요" 화면이 잠깐 보이는 것) 방지:
  // 이전에 로그인했던 적이 있으면 Firebase 초기화(비동기)를 기다리지 않고 바로
  // 콘텐츠를 보여준다. 실제로 로그아웃된 상태였다면 아래 onAuthStateChanged가
  // 금방 signedOut 화면으로 바로잡는다.
  if (localStorage.getItem("iaAuthed") === "1") {
    document.getElementById("signedOut").style.display = "none";
    document.getElementById("contentArea").style.display = "block";
  }
</script>
<script type="module">
  import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { auth, db, provider } from "./firebase-init.js";
  import "./pwa-register.js";
  import { formatKRW, formatPct, escapeHtml, renderDelta, signClass, renderAllocationRows, ASSET_CLASS_ORDER } from "./charts.js";
  import { computeHoldings, applyPrices } from "./holdings-calc.js";
  import { classifyAssetClass } from "./asset-classify.js";

  const $ = (id) => document.getElementById(id);
  const signedOutEl = $("signedOut");
  const contentAreaEl = $("contentArea");
  const statusEl = $("status");

  $("loginBtn").addEventListener("click", () => {
    signInWithPopup(auth, provider).catch((err) => { statusEl.textContent = "로그인 실패: " + err.message; });
  });

  let transactions = [];
  let priceMap = {};
  let priceUpdatedAt = null;
  let unsubTx = null;
  let unsubPrices = null;
  let targetAllocation = null;
  let targetMonth = null;

  async function loadTargetAllocation() {
    const snap = await getDocs(collection(db, "monthly_reports"));
    let best = null;
    snap.forEach((doc) => {
      const d = doc.data();
      if (d.target_allocation && Object.keys(d.target_allocation).length > 0) {
        if (!best || d.month > best.month) best = d;
      }
    });
    if (best) {
      targetAllocation = best.target_allocation;
      targetMonth = best.month;
    }
  }

  function recomputeAndRender() {
    if (transactions.length === 0) return;
    const holdings = applyPrices(computeHoldings(transactions), priceMap);
    holdings.sort((a, b) => b.eval_total_krw - a.eval_total_krw);

    const totalEval = holdings.reduce((s, h) => s + h.eval_total_krw, 0);
    const totalInvested = holdings.reduce((s, h) => s + h.total_buy_krw, 0);
    const totalProfit = totalEval - totalInvested;
    const overallPct = totalInvested ? (totalProfit / totalInvested) * 100 : 0;

    $("statEval").textContent = "₩" + Math.round(totalEval).toLocaleString();
    $("statProfit").innerHTML = `${renderDelta(overallPct)} 평가손익 ${formatKRW(totalProfit)}`;
    $("statInvested").textContent = `· 원금 ${formatKRW(totalInvested)}`;
    $("statCount").textContent = `${holdings.length}`;

    const breakdown = {};
    holdings.forEach((h) => {
      const cls = classifyAssetClass(h);
      if (!breakdown[cls]) breakdown[cls] = { eval_krw: 0, invested_krw: 0 };
      breakdown[cls].eval_krw += h.eval_total_krw;
      breakdown[cls].invested_krw += h.total_buy_krw;
    });

    if (targetAllocation) {
      // 목표와 ±5%p 넘게 벌어진 자산군은 경고색 - 리밸런싱 제안 기준(REBALANCE_BAND_PP)과 같은 폭.
      $("targetChartTitle").textContent = "목표 비중 대비";
      $("targetChartSub").textContent = `${targetMonth} 목표 · ±5%p 기준`;
      $("targetArea").innerHTML = ASSET_CLASS_ORDER
        .filter((c) => targetAllocation[c.key] !== undefined || breakdown[c.key])
        .map((c) => {
          const target = targetAllocation[c.key] || 0;
          const current = totalEval ? ((breakdown[c.key]?.eval_krw || 0) / totalEval) * 100 : 0;
          const diff = current - target;
          return `
            <div class="cmp-row">
              <div class="cmp-top">
                <span class="dot" style="background:var(${c.colorVar})"></span>
                <span class="label">${c.key}</span>
                <span class="num" style="font-weight:600">${current.toFixed(1)}%</span>
                <span class="target">/ ${target}%</span>
                <span class="diff ${Math.abs(diff) > 5 ? "over" : ""}">${diff > 0 ? "+" : diff < 0 ? "−" : ""}${Math.abs(diff).toFixed(1)}%p</span>
              </div>
              <div class="cmp-track">
                <div class="fill" style="width:${Math.min(100, current)}%; background:var(${c.colorVar})"></div>
                <div class="marker" style="left:${Math.min(100, target)}%"></div>
              </div>
            </div>`;
        }).join("");
    } else {
      $("targetChartTitle").textContent = "자산 배분";
      $("targetChartSub").textContent = "목표 비중은 반기 리포트에서 생성";
      $("targetArea").innerHTML = renderAllocationRows(breakdown);
    }

    $("holdingsRows").innerHTML = holdings.map((h) => `
      <a class="list-row" href="stock-detail.html?code=${encodeURIComponent(h.code)}">
        <div class="list-main">
          <div class="list-name">${escapeHtml(h.name)}${h.price_is_live ? "" : '<span class="stale-badge">실시간 미지원</span>'}</div>
          <div class="list-sub">${escapeHtml(classifyAssetClass(h))} · ${h.quantity.toLocaleString()} × 평단 ${Math.round(h.avg_buy_price_krw).toLocaleString()}</div>
        </div>
        <div class="list-end">
          <div class="list-value">${Math.round(h.eval_total_krw).toLocaleString()}</div>
          <div class="list-delta ${signClass(h.profit_pct)}">${formatPct(h.profit_pct)} · ${formatKRW(h.profit_krw)}</div>
        </div>
      </a>
    `).join("") || `<p class="empty-note" style="padding:12px 0">보유 종목 없음</p>`;

    if (priceUpdatedAt) {
      $("lastUpdated").textContent = `마지막 시세 갱신: ${priceUpdatedAt.toLocaleTimeString("ko-KR")}`;
    }
  }

  function startListening() {
    loadTargetAllocation().then(recomputeAndRender);

    unsubTx = onSnapshot(collection(db, "transactions"), (snap) => {
      transactions = snap.docs.map((d) => d.data());
      recomputeAndRender();
    }, (err) => { statusEl.textContent = "거래 내역 로드 실패: " + err.message; });

    unsubPrices = onSnapshot(collection(db, "latest_prices"), (snap) => {
      const map = {};
      let latest = null;
      snap.forEach((doc) => {
        const d = doc.data();
        map[doc.id] = d;
        const ts = d.updated_at?.toDate ? d.updated_at.toDate() : null;
        if (ts && (!latest || ts > latest)) latest = ts;
      });
      priceMap = map;
      priceUpdatedAt = latest;
      recomputeAndRender();
    }, (err) => { statusEl.textContent = "시세 로드 실패: " + err.message; });
  }

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      localStorage.removeItem("iaAuthed");
      signedOutEl.style.display = "block";
      contentAreaEl.style.display = "none";
      if (unsubTx) unsubTx();
      if (unsubPrices) unsubPrices();
      return;
    }
    localStorage.setItem("iaAuthed", "1");
    signedOutEl.style.display = "none";
    contentAreaEl.style.display = "block";
    startListening();
  });
</script>

    <a href="journal.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>일지</a>
    <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>리포트</a>
    <a href="more.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>더보기</a>
